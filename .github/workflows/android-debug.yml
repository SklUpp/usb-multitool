name: android-debug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-usb-multitool


concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: usb-multitool

jobs:
  fatfs-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run FatFs host image tests
        working-directory: usb-multitool/native-tests/fatfs
        run: make test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        working-directory: ${{ github.workspace }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        working-directory: ${{ github.workspace }}
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Host exFAT fsck repair test
        run: ./scripts/run-exfat-fsck-host-test.sh

      - name: Host NTFS test
        run: ./scripts/run-ntfs-host-test.sh

      - name: Install fetch helpers
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y lzip unzip

      - name: Fetch pinned upstream engines
        run: |
          bash scripts/fetch-third-party.sh
          test -f third_party/fatfs/source/ff.c
          test -f third_party/ntfs-3g/libntfs-3g/ntfs.c
          test -f third_party/lwext4/include/ext4.h
          test -f third_party/ventoy/INSTALL
          test -f third_party/f3/f3probe.c
          test -f third_party/ddrescue/mapfile.cc

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK with engines required
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -PusbRequireEngines=true \
            -PusbWithFatfs=true \
            -PusbWithNtfs=true \
            -PusbWithLwext4=true \
            -PusbWithVentoy=true \
            -PusbWithF3=true \
            -PusbWithDdrescue=true

      - name: Lint debug
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: usb-multitool/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            usb-multitool/app/build/reports/tests/
            usb-multitool/app/build/test-results/
          if-no-files-found: warn
